name: mediloop
description: MediLoop - Pharma Reverse Chain Compliance Platform. Every batch, closed the loop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.8.4

  # State management & routing
  provider: ^6.1.2
  go_router: ^14.6.3

  # Camera & QR scanning
  camera: ^0.11.0+2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  file_picker: ^10.3.10

  # AI
  google_generative_ai: ^0.4.7

  # Offline queue
  shared_preferences: ^2.3.4

  # Crypto for hash chain
  crypto: ^3.0.6

  # UI utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  uuid: ^4.5.1
  path: ^1.9.1
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
